{% extends 'base.html' %}

{% block title %}Видалення поста{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('.static', filename='css/posts.css') }}">
{% endblock %}

{% block content %}
<section class="cv-section delete-box">
    <h2><i class="bi bi-exclamation-triangle-fill"></i> Підтвердження видалення</h2>
    <p>Ви дійсно хочете видалити пост <strong>«{{ post.title }}»</strong>? Цю дію не можна скасувати.</p>

    <form method="post" class="d-flex flex-wrap gap-2">
        {{ form.hidden_tag() }}
        <button type="submit" class="btn btn-danger-cv">
            <i class="bi bi-trash3-fill"></i> Так, видалити
        </button>
        <a href="{{ url_for('.detail_post', id=post.id) }}" class="btn btn-outline-dark">Скасувати</a>
    </form>
</section>
{% endblock %}
