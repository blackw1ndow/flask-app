{% extends 'base.html' %}

{% block title %}Товари{% endblock %}

{% block content %}
<section class="cv-section" aria-labelledby="products-heading">
    <h2 id="products-heading"><i class="bi bi-bag-fill"></i> Список товарів</h2>
    <div class="row g-3">
        {% for product in products %}
        <div class="col-md-4">
            <article class="product-card h-100">
                <h3>{{ product.name }}</h3>
                <p class="product-content">{{ product.content }}</p>
                <div class="product-footer">
                    <span class="product-price">${{ product.price }}</span>
                    <a href="{{ url_for('products.detail_product', id=product.id) }}" class="btn btn-dark btn-sm">
                        Детальніше <i class="bi bi-arrow-right"></i>
                    </a>
                </div>
            </article>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
