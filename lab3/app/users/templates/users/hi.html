{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="row g-4">
    <!-- Vertical navigation -->
    <aside class="col-md-4 col-lg-3">
        <nav class="side-nav" aria-label="Меню користувачів">
            <p class="side-nav-title">Користувачі</p>
            <ul>
                <li>
                    <a href="{{ url_for('users.greetings', name='John', age=30) }}"
                       class="{% if name == 'JOHN' %}active{% endif %}">
                        <i class="bi bi-person"></i> Greet John
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('users.greetings', name='Guest') }}"
                       class="{% if name == 'GUEST' %}active{% endif %}">
                        <i class="bi bi-person-dash"></i> Greet Guest
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('users.admin') }}"
                       class="{% if name == 'ADMINISTRATOR' %}active{% endif %}">
                        <i class="bi bi-shield-lock"></i> Admin
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main content -->
    <section class="col-md-8 col-lg-9 greeting" aria-labelledby="greeting-heading">
        <h2 id="greeting-heading" class="greeting-title">Hello :)</h2>
        <p class="greeting-user">User: <strong>{{ name }}</strong></p>
        {% if age %}
        <p class="greeting-age age-ok"><i class="bi bi-check-circle-fill"></i> Age: {{ age }}</p>
        {% else %}
        <p class="greeting-age age-missing"><i class="bi bi-question-circle-fill"></i> Age: Not provided</p>
        {% endif %}
    </section>
</div>
{% endblock %}
